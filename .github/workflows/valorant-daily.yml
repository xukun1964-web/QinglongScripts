name: Valorant CN Daily Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: 查询并推送；check: 仅验证商店；push-test: 测试微信通道'
        type: choice
        default: daily
        options:
          - daily
          - check
          - push-test
  schedule:
    # UTC 00:17 = 北京时间 08:17。GitHub 调度可能延迟。
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: valorant-cn-daily
  cancel-in-progress: false

jobs:
  store:
    # Secrets only run with code on the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify runtime and offline tests (no secrets)
        run: |
          python -m pip install --disable-pip-version-check -r valorant_cn/requirements.txt
          python -m unittest discover -s tests/valorant_cn -v
      - name: Query own store and notify
        env:
          VALORANT_AUTH_JSON: ${{ secrets.VALORANT_AUTH_JSON }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          RUN_MODE: ${{ inputs.mode || 'daily' }}
          PYTHONUTF8: '1'
        shell: bash
        run: |
          case "$RUN_MODE" in
            daily) python -m valorant_cn ;;
            check) python -m valorant_cn --check-only ;;
            push-test) python -m valorant_cn --push-test ;;
            *) echo 'Unsupported mode'; exit 1 ;;
          esac
